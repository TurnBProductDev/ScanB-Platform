<title>Two Graphs and a Hard Rule</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#0B1012; --panel:#101A1C; --rule:#222F32; --text:#E8EFED;
  --dim:#95A8A6; --dim2:#6E807F; --acc:#E8A33B; --accd:#8A6524;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
#stage{position:relative;width:1280px;height:720px;background:var(--bg);
  transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .18s linear}
.slide.on{opacity:1;visibility:visible}
.slide svg{display:block;width:1280px;height:720px}
#chrome{position:absolute;left:64px;right:64px;bottom:6px;height:22px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'IBM Plex Mono',ui-monospace,monospace}
#nav{display:flex;align-items:center;gap:8px}
#nav button{width:22px;height:22px;padding:0;border:1px solid var(--rule);
  background:var(--panel);color:var(--dim);font-family:inherit;font-size:12px;
  line-height:1;border-radius:2px;cursor:pointer;transition:border-color .12s,color .12s}
#nav button:hover{border-color:var(--accd);color:var(--acc)}
#nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#deck{font-size:11px;letter-spacing:.14em;color:var(--dim2);margin-left:6px;
  text-transform:uppercase}
#right{display:flex;align-items:center;gap:16px}
#ticks{display:flex;gap:6px}
#ticks i{display:block;width:40px;height:3px;background:var(--rule)}
#ticks i.seen{background:var(--accd)}
#ticks i.now{background:var(--acc)}
#count{font-size:11px;letter-spacing:.1em;color:var(--dim);
  font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="am" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#526B6D"/></marker>
<marker id="ad" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#95A8A6"/></marker>
<marker id="aa" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#E8A33B"/></marker>

<section class="slide" aria-label="Slide 1 of 6: Two Graphs and a Hard Rule"><svg viewBox="0 0 1280 720" role="img" aria-label="Two LangGraph agent systems, one reactive and one proactive, pointed in opposite directions."><rect x="0" y="0" width="1280" height="720" fill="#0B1012"/><text x="64" y="54" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.6">SCANB / THE AI ARCHITECTURE</text><text x="64" y="94" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="40" fill="#E8EFED" font-weight="700" letter-spacing="-0.2">Two Graphs and a Hard Rule</text><line x1="64" y1="108" x2="1216" y2="108" stroke="#222F32" stroke-width="1"/><text x="64" y="130" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="14.5" fill="#95A8A6" font-weight="400">Two LangGraph agent systems run inside ScanB. They are built to travel in opposite directions.</text><text x="64" y="164" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="600" letter-spacing="1.6">01 / REACTIVE   THE ASSISTANT</text><rect x="64" y="176" width="290" height="84" fill="#101A1C" stroke="#2C3C3F" stroke-width="1" rx="3"/><text x="82" y="198" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="600" letter-spacing="1.4">TRIGGER</text><text x="82" y="221" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="16" fill="#E8EFED" font-weight="500">A manager asks</text><text x="82" y="239" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">A question typed into the chat</text><text x="82" y="254" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">panel, in her own words.</text><rect x="460" y="176" width="360" height="84" fill="#141D20" stroke="#E8A33B" stroke-width="1.4" rx="3"/><text x="478" y="198" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">REACTIVE AGENT</text><text x="478" y="221" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="16" fill="#E8EFED" font-weight="500">A fixed graph, walked in seconds.</text><rect x="926" y="176" width="290" height="84" fill="#101A1C" stroke="#2C3C3F" stroke-width="1" rx="3"/><text x="944" y="198" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="600" letter-spacing="1.4">DELIVERED TO</text><text x="944" y="221" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="16" fill="#E8EFED" font-weight="500">The screen she is on</text><text x="944" y="239" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">The answer arrives while she</text><text x="944" y="254" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">is still looking at it.</text><text x="64" y="290" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="17" fill="#E8EFED" font-weight="500">The user set the agenda.</text><rect x="472" y="232" width="78" height="22" fill="#1B262A" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="511" y="247" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">plan</text><rect x="558" y="232" width="78" height="22" fill="#1B262A" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="597" y="247" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">query</text><line x1="550" y1="243" x2="555" y2="243" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><rect x="644" y="232" width="78" height="22" fill="#1B262A" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="683" y="247" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">verify</text><line x1="636" y1="243" x2="641" y2="243" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><rect x="730" y="232" width="78" height="22" fill="#1B262A" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="769" y="247" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">answer</text><line x1="722" y1="243" x2="727" y2="243" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><text x="407" y="209" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#95A8A6" font-weight="500" text-anchor="middle" letter-spacing="0.6">a question</text><line x1="354" y1="218" x2="457" y2="218" stroke="#95A8A6" stroke-width="1.2" marker-end="url(#ad)"/><text x="873" y="209" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#95A8A6" font-weight="500" text-anchor="middle" letter-spacing="0.6">an answer</text><line x1="820" y1="218" x2="923" y2="218" stroke="#95A8A6" stroke-width="1.2" marker-end="url(#ad)"/><text x="64" y="380" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="600" letter-spacing="1.6">02 / PROACTIVE   THE GENERATOR</text><rect x="64" y="392" width="290" height="84" fill="#101A1C" stroke="#2C3C3F" stroke-width="1" rx="3"/><text x="82" y="414" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="600" letter-spacing="1.4">DELIVERED TO</text><text x="82" y="437" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="16" fill="#E8EFED" font-weight="500">A briefing already there</text><text x="82" y="455" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">Ranked and written before</text><text x="82" y="470" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">anyone opened the tab.</text><rect x="460" y="392" width="360" height="84" fill="#141D20" stroke="#E8A33B" stroke-width="1.4" rx="3"/><text x="478" y="414" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">PROACTIVE AGENT</text><text x="478" y="437" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="16" fill="#E8EFED" font-weight="500">The whole business, unattended.</text><rect x="926" y="392" width="290" height="84" fill="#101A1C" stroke="#2C3C3F" stroke-width="1" rx="3"/><text x="944" y="414" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="600" letter-spacing="1.4">TRIGGER</text><text x="944" y="437" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="16" fill="#E8EFED" font-weight="500">A nightly schedule</text><text x="944" y="455" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">Nobody asked a question.</text><text x="944" y="470" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">The clock did.</text><text x="64" y="506" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="17" fill="#F2C480" font-weight="500">The agent set the agenda.</text><rect x="472" y="448" width="108" height="22" fill="#1B262A" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="526" y="463" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">scan</text><rect x="588" y="448" width="108" height="22" fill="#1B262A" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="642" y="463" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">rank</text><line x1="580" y1="459" x2="585" y2="459" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><rect x="704" y="448" width="108" height="22" fill="#1B262A" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="758" y="463" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">write</text><line x1="696" y1="459" x2="701" y2="459" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><text x="873" y="425" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#95A8A6" font-weight="500" text-anchor="middle" letter-spacing="0.6">a wake-up</text><line x1="923" y1="434" x2="823" y2="434" stroke="#95A8A6" stroke-width="1.2" marker-end="url(#ad)"/><text x="407" y="425" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#95A8A6" font-weight="500" text-anchor="middle" letter-spacing="0.6">a briefing</text><line x1="457" y1="434" x2="357" y2="434" stroke="#95A8A6" stroke-width="1.2" marker-end="url(#ad)"/><line x1="64" y1="542" x2="1216" y2="542" stroke="#222F32" stroke-width="1"/><rect x="64" y="566" width="3" height="86" fill="#E8A33B" stroke="none" stroke-width="1"/><text x="86" y="588" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="20" fill="#E8EFED" font-weight="400">The proactive half is the harder problem: deciding what</text><text x="86" y="615" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="20" fill="#E8EFED" font-weight="400">is worth saying when nobody has said what to look for,</text><text x="86" y="642" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="20" fill="#E8EFED" font-weight="400">and not repeating yourself tomorrow.</text><text x="800" y="574" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">NO ANCHOR</text><text x="800" y="594" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">No question narrows the search, so the agent ranks</text><text x="800" y="610" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">the whole business against itself.</text><text x="800" y="636" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">NO REPEATS</text><text x="800" y="656" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">Cross-run memory suppresses what it already said,</text><text x="800" y="672" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">unless something genuinely changed.</text></svg></section>
<section class="slide" aria-label="Slide 2 of 6: Fifteen nodes, one fixed topology"><svg viewBox="0 0 1280 720" role="img" aria-label="The reactive assistant drawn as a LangGraph state machine with its retrieval stack."><rect x="0" y="0" width="1280" height="720" fill="#0B1012"/><text x="64" y="54" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.6">THE ASSISTANT   PYTHON / FASTAPI / LANGGRAPH</text><text x="64" y="94" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="40" fill="#E8EFED" font-weight="700" letter-spacing="-0.2">Fifteen nodes, one fixed topology</text><line x1="64" y1="108" x2="1216" y2="108" stroke="#222F32" stroke-width="1"/><text x="64" y="130" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="14.5" fill="#95A8A6" font-weight="400">Every request walks the same state machine. Only which fork it takes, and where it stops, changes.</text><rect x="64" y="150" width="118" height="34" fill="#151F22" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="123" y="170.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">intake</text><rect x="196" y="150" width="118" height="34" fill="#151F22" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="255" y="170.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">entity_guard</text><rect x="328" y="150" width="118" height="34" fill="#151F22" stroke="#E8A33B" stroke-width="1.4" rx="2"/><text x="387" y="170.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">query_router</text><line x1="182" y1="167" x2="193" y2="167" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><line x1="314" y1="167" x2="325" y2="167" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><polyline points="64,192 64,198 182,19 idth="130" height="34" fill="#151F22" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="973" y="270.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">result_analyzer</text><line x1="892" y1="267" x2="905" y2="267" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><rect x="470" y="350" width="130" height="34" fill="#151F22" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="535" y="370.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">query_planner</text><rect x="616" y="350" width="130" height="34" fill="#151F22" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="681" y="370.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">step_executor</text><line x1="600" y1="367" x2="613" y2="367" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><rect x="762" y="350" width="130" height="34" fill="#151F22" stroke="#E8A33B" stroke-width="1.4" rx="2"/><text x="827" y="370.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">plan_reviewer</text><line x1="746" y1="367" x2="759" y2="367" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><rect x="908" y="350" width="130" height="34" fill="#151F22" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="973" y="370.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">synthesizer</text><line x1="892" y1="367" x2="905" y2="367" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><polyline points="681,284 681,304 535,304 535,287" fill="none" stroke="#E8A33B" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#aa)"/><text x="608" y="320" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">exact error text attached   max 3 attempts</text><polyline points="1038,267 1052,267 1052,290 1061,290" fill="none" stroke="#95A8A6" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ad)"/><polyline points="1038,367 1052,367 1052,310 1061,310" fill="none" stroke="#95A8A6" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ad)"/><rect x="1064" y="283" width="152" height="34" fill="#151F22" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="1140" y="303.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">response_formatter</text><text x="1064" y="276" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="400">rows + a reading</text><text x="1064" y="334" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="400">a synthesised plan</text><line x1="1140" y1="317" x2="1140" y2="377" stroke="#95A8A6" stroke-width="1.2" marker-end="url(#ad)"/><text x="1132" y="352" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="400" text-anchor="end">draft answer</text><rect x="1064" y="380" width="152" height="34" fill="#151F22" stroke="#E8A33B" stroke-width="1.4" rx="2"/><text x="1140" y="400.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">answer_verifier</text><line x1="1140" y1="414" x2="1140" y2="437" stroke="#E8A33B" stroke-width="1.2" marker-end="url(#aa)"/><rect x="1064" y="440" width="72" height="26" fill="#161113" stroke="#E8A33B" stroke-width="1.4" rx="13"/><text x="1100" y="457" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="600" text-anchor="middle" letter-spacing="1">END</text><line x1="387" y1="184" x2="387" y2="247" stroke="#E8A33B" stroke-width="1.2" marker-end="url(#aa)"/><text x="379" y="215" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="end">cannot disambiguate</text><rect x="328" y="250" width="118" height="34" fill="#101A1C" stroke="#8A6524" stroke-width="1" rx="2" stroke-dasharray="3 3"/><text x="387" y="270.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">clarify</text><text x="387" y="302" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="400" text-anchor="middle">terminal, it asks</text><polyline points="892,267 900,267 900,410 978,410 978,433" fill="none" stroke="#8A6524" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#aa)"/><polyline points="681,384 681,410 972,410" fill="none" stroke="#8A6524" stroke-width="1.2" stroke-linejoin="round"/><text x="800" y="402" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">unrecoverable failure</text><rect x="908" y="436" width="140" height="34" fill="#101A1C" stroke="#8A6524" stroke-width="1" rx="2" stroke-dasharray="3 3"/><text x="978" y="456.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">execution_error</text><text x="978" y="484" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="400" text-anchor="middle">terminal</text><line x1="64" y1="490" x2="1216" y2="490" stroke="#222F32" stroke-width="1"/><text x="64" y="508" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.6">RETRIEVAL STACK   QUERIED IN THIS ORDER</text><line x1="255" y1="184" x2="255" y2="513" stroke="#526B6D" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#am)"/><text x="262" y="344" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="400">entity mentions</text><rect x="64" y="518" width="330" height="94" fill="#101A1C" stroke="#222F32" stroke-width="1" rx="3"/><text x="80" y="548" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="22" fill="#E8A33B" font-weight="700">01</text><text x="112" y="547" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="14.5" fill="#E8EFED" font-weight="500">DuckDB entity master</text><text x="80" y="570" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">Exact and alias lookup. Tried first, because it is</text><text x="80" y="585" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">faster and more certain than a vector search.</text><text x="80" y="601" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="500" letter-spacing="0.6">called by entity_guard</text><rect x="500" y="518" width="330" height="94" fill="#101A1C" stroke="#222F32" stroke-width="1" rx="3"/><text x="516" y="548" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="22" fill="#E8A33B" font-weight="700">02</text><text x="548" y="547" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="14.5" fill="#E8EFED" font-weight="500">FAISS vector index</text><text x="516" y="570" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">Semantic match, used only when the exact</text><text x="516" y="585" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">lookup misses.</text><text x="516" y="601" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="500" letter-spacing="0.6">called by entity_guard</text><rect x="870" y="518" width="346" height="94" fill="#101A1C" stroke="#222F32" stroke-width="1" rx="3"/><text x="886" y="548" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="22" fill="#E8A33B" font-weight="700">03</text><text x="918" y="547" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="14.5" fill="#E8EFED" font-weight="500">Kuzu knowledge graph</text><text x="886" y="570" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">Where the generated Cypher actually runs, once</text><text x="886" y="585" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">the validator and the RBAC rewrite have passed.</text><text x="886" y="601" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="500" letter-spacing="0.6">called by graph_executor</text><text x="447" y="556" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">no exact match</text><line x1="397" y1="565" x2="494" y2="565" stroke="#E8A33B" stroke-width="1.2" marker-end="url(#aa)"/><line x1="850" y1="518" x2="850" y2="612" stroke="#222F32" stroke-width="1"/><text x="64" y="640" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="15" fill="#E8EFED" font-weight="400">If resolution still cannot tell which of two things the user meant, it routes to clarify and asks. </text><text x="781.75" y="640" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="15" fill="#E8A33B" font-weight="500">It does not guess.</text><text x="64" y="668" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="400" letter-spacing="0.4">SOLID = state edge       DASHED = data access       AMBER = decision, gate or terminal</text></svg></section>
<section class="slide" aria-label="Slide 3 of 6: Gates against a confident wrong answer"><svg viewBox="0 0 1280 720" role="img" aria-label="The validator, the RBAC enforcer and the answer verifier, drawn on the request path."><rect x="0" y="0" width="1280" height="720" fill="#0B1012"/><text x="64" y="54" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.6">THE ASSISTANT   THE SAFETY PATH</text><text x="64" y="94" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="40" fill="#E8EFED" font-weight="700" letter-spacing="-0.2">Gates against a confident wrong answer</text><line x1="64" y1="108" x2="1216" y2="108" stroke="#222F32" stroke-width="1"/><text x="64" y="130" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="14.5" fill="#95A8A6" font-weight="400">Three mechanisms sit on the request path. Every answer has to pass all three, in this order.</text><rect x="64" y="148" width="150" height="28" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="139" y="165.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">generated Cypher</text><line x1="214" y1="162" x2="223" y2="162" stroke="#E8A33B" stroke-width="1.2" marker-end="url(#aa)"/><line x1="270" y1="162" x2="613" y2="162" stroke="#95A8A6" stroke-width="1.2" marker-end="url(#ad)"/><text x="442" y="153" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#95A8A6" font-weight="500" text-anchor="middle" letter-spacing="0.6">schema-valid Cypher</text><line x1="662" y1="162" x2="754" y2="162" stroke="#95A8A6" stroke-width="1.2" marker-end="url(#ad)"/><text x="708" y="153" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#95A8A6" font-weight="500" text-anchor="middle" letter-spacing="0.6">scoped Cypher</text><rect x="760" y="148" width="140" height="28" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="830" y="166.32" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="500" text-anchor="middle">the graph executes</text><line x1="900" y1="162" x2="1005" y2="162" stroke="#95A8A6" stroke-width="1.2" marker-end="url(#ad)"/><text x="953" y="153" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#95A8A6" font-weight="500" text-anchor="middle" letter-spacing="0.6">rows + draft</text><line x1="1054" y1="162" x2="1085" y2="162" stroke="#95A8A6" stroke-width="1.2" marker-end="url(#ad)"/><text x="1070" y="140" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#95A8A6" font-weight="500" text-anchor="middle" letter-spacing="0.6">verified</text><rect x="1090" y="148" width="126" height="28" fill="#141D20" stroke="#8A6524" stroke-width="1" rx="2"/><text x="1153" y="166.32" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#F2C480" font-weight="500" text-anchor="middle">the answer</text><path d="M 226 162 L 237 145 L 259 145 L 270 162 L 259 179 L 237 179 Z" fill="#1B1710" stroke="#E8A33B" stroke-width="1.4" stroke-linejoin="round"/><text x="248" y="167" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#F2C480" font-weight="600" text-anchor="middle">01</text><path d="M 618 162 L 629 145 L 651 145 L 662 162 L 651 179 L 629 179 Z" fill="#1B1710" stroke="#E8A33B" stroke-width="1.4" stroke-linejoin="round"/><text x="640" y="167" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#F2C480" font-weight="600" text-anchor="middle">02</text><path d="M 1010 162 L 1021 145 L 1043 145 L 1054 162 L 1043 179 L 1021 179 Z" fill="#1B1710" stroke="#E8A33B" stroke-width="1.4" stroke-linejoin="round"/><text x="1032" y="167" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12" fill="#F2C480" font-weight="600" text-anchor="middle">03</text><rect x="64" y="206" width="40" height="2" fill="#E8A33B" stroke="none" stroke-width="1"/><text x="64" y="244" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="26" fill="#E8A33B" font-weight="700">01</text><text x="104" y="244" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="24" fill="#E8EFED" font-weight="700" letter-spacing="0.2">THE VALIDATOR</text><text x="64" y="268" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">It regex-parses every table and column out of</text><text x="64" y="285" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">the generated Cypher and cross-checks them</text><text x="64" y="302" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">against the live schema.</text><rect x="456" y="206" width="40" height="2" fill="#E8A33B" stroke="none" stroke-width="1"/><text x="456" y="244" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="26" fill="#E8A33B" font-weight="700">02</text><text x="496" y="244" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="24" fill="#E8EFED" font-weight="700" letter-spacing="0.2">THE RBAC ENFORCER</text><text x="456" y="268" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">It rewrites the query to inject the signed-in</text><text x="456" y="285" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">user's data-scope keys, recursively, wherever</text><text x="456" y="302" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">a clause can hide a row.</text><rect x="848" y="206" width="40" height="2" fill="#E8A33B" stroke="none" stroke-width="1"/><text x="848" y="244" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="26" fill="#E8A33B" font-weight="700">03</text><text x="888" y="244" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="24" fill="#E8EFED" font-weight="700" letter-spacing="0.2">THE ANSWER VERIFIER</text><text x="848" y="268" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">It reads the finished prose back against the</text><text x="848" y="285" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">rows it came from, figure by figure.</text><rect x="80" y="316" width="210" height="26" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="185" y="332.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">generated Cypher</text><line x1="185" y1="342" x2="185" y2="352" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><rect x="80" y="356" width="210" height="26" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="185" y="372.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">regex-extract tables + columns</text><text x="432" y="352" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="end" letter-spacing="0.6">cross-check</text><line x1="292" y1="369" x2="325" y2="369" stroke="#E8A33B" stroke-width="1.2" marker-end="url(#aa)"/><rect x="328" y="356" width="104" height="26" fill="#141D20" stroke="#8A6524" stroke-width="1" rx="2"/><text x="380" y="372.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">live schema</text><polyline points="185,382 185,394 130,394 130,399" fill="none" stroke="#526B6D" stroke-width="1" stroke-linejoin="round" marker-end="url(#am)"/><polyline points="185,394 246,394 246,399" fill="none" stroke="#8A6524" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#aa)"/><rect x="80" y="402" width="100" height="26" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="130" y="418.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#95A8A6" font-weight="500" text-anchor="middle">pass</text><rect x="196" y="402" width="100" height="26" fill="#141D20" stroke="#8A6524" stroke-width="1" rx="2"/><text x="246" y="418.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">fail</text><polyline points="296,415 316,415 316,300 185,300 185,311" fill="none" stroke="#8A6524" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#aa)"/><text x="310" y="296" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="end">the error text, up to 3 attempts</text><text x="64" y="492" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">Nothing runs against the graph until every name in the</text><text x="64" y="509" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">query is a name the schema really has.</text><text x="64" y="526" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400"></text><text x="64" y="543" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">A failure does not surface to the user. It loops back to the</text><text x="64" y="560" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">generator with the exact error attached, three times over.</text><text x="472" y="320" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="600" letter-spacing="1.2">THE REWRITE REACHES INSIDE</text><rect x="472" y="332" width="230" height="20" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="481" y="346" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500">MATCH</text><line x1="706" y1="342" x2="716" y2="342" stroke="#E8A33B" stroke-width="1" marker-end="url(#aa)"/><text x="722" y="346" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500">+ scope keys</text><rect x="486" y="356" width="216" height="20" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="495" y="370" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500">UNION arm</text><line x1="706" y1="366" x2="716" y2="366" stroke="#E8A33B" stroke-width="1" marker-end="url(#aa)"/><text x="722" y="370" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500">+ scope keys</text><rect x="486" y="380" width="216" height="20" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="495" y="394" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500">CALL / EXISTS subquery</text><line x1="706" y1="390" x2="716" y2="390" stroke="#E8A33B" stroke-width="1" marker-end="url(#aa)"/><text x="722" y="394" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500">+ scope keys</text><rect x="486" y="404" width="216" height="20" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="495" y="418" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500">OPTIONAL MATCH</text><line x1="706" y1="414" x2="716" y2="414" stroke="#E8A33B" stroke-width="1" marker-end="url(#aa)"/><text x="722" y="418" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500">+ scope keys</text><rect x="486" y="428" width="216" height="20" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="495" y="442" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500">variable-length relationship</text><line x1="706" y1="438" x2="716" y2="438" stroke="#E8A33B" stroke-width="1" marker-end="url(#aa)"/><text x="722" y="442" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500">+ scope keys</text><polyline points="478,352 478,442 486,442" fill="none" stroke="#8A6524" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="472" y="470" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500">recursively, all the way down</text><text x="456" y="492" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">Deny by default: a query it cannot prove secure raises a</text><text x="456" y="509" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">SecurityError and is refused rather than run. Mutating</text><text x="456" y="526" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">clauses are blocked outright.</text><text x="456" y="543" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400"></text><text x="456" y="560" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">Two engines run side by side, a proven regex engine</text><text x="456" y="577" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">(authoritative) and a structure-aware AST engine in shadow</text><text x="456" y="594" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">mode. Divergences are logged, not acted on.</text><rect x="864" y="316" width="210" height="26" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="969" y="332.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">figures in the written answer</text><line x1="969" y1="344" x2="969" y2="366" stroke="#E8A33B" stroke-width="1.2" marker-end="url(#aa)"/><line x1="1030" y1="366" x2="1030" y2="344" stroke="#E8A33B" stroke-width="1.2" marker-end="url(#aa)"/><text x="1084" y="348" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500">every figure</text><text x="1084" y="364" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500">traced to a row</text><rect x="864" y="372" width="210" height="26" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="969" y="388.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">the rows that came back</text><text x="864" y="420" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="600" letter-spacing="1.2">AND WHEN NOTHING COMES BACK</text><rect x="864" y="430" width="168" height="36" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="948" y="446" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">the data really</text><text x="948" y="459" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">says zero</text><rect x="1048" y="430" width="168" height="36" fill="#141D20" stroke="#8A6524" stroke-width="1" rx="2"/><text x="1132" y="446" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">the user's permissions</text><text x="1132" y="459" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">excluded them</text><text x="1040" y="452" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="400" text-anchor="middle">or</text><text x="848" y="492" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">Every figure in the prose is checked against the rows it</text><text x="848" y="509" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">was drawn from before the answer is released.</text><text x="848" y="526" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400"></text><text x="848" y="543" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">An empty result and a hidden one are not the same answer,</text><text x="848" y="560" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">and it says which of the two it is.</text><line x1="64" y1="618" x2="1216" y2="618" stroke="#222F32" stroke-width="1"/><text x="64" y="640" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">MODEL TIERING</text><text x="64" y="660" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">A small model classifies and routes. A strong model</text><text x="64" y="675" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">writes the Cypher and the synthesis.</text><text x="456" y="640" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">PER-TENANT SCHEMA MODULES</text><text x="456" y="660" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">Each carries its own schema definition, secured-</text><text x="456" y="675" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">relationship set and entity-scope map.</text><text x="848" y="640" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">PER-QUERY TRACE RECORDER</text><text x="848" y="660" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">Every stage, prompt and token count, gzipped to blob</text><text x="848" y="675" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11.5" fill="#95A8A6" font-weight="400">with 30-day expiry. Prompt redaction optional.</text></svg></section>

pace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">gap_scan</text><rect x="356" y="408" width="128" height="34" fill="#151F22" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="420" y="428.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">investigator</text><rect x="210" y="408" width="128" height="34" fill="#151F22" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="274" y="428.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">synthesizer</text><rect x="64" y="408" width="128" height="34" fill="#1B1710" stroke="#E8A33B" stroke-width="1.4" rx="2"/><text x="128" y="422" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">insight_</text><text x="128" y="435" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">branch_done</text><line x1="940" y1="425" x2="925" y2="425" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><line x1="794" y1="425" x2="779" y2="425" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><line x1="648" y1="425" x2="633" y2="425" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><line x1="502" y1="425" x2="487" y2="425" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><line x1="356" y1="425" x2="341" y2="425" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><line x1="210" y1="425" x2="195" y2="425" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><polyline points="1068,369 1082,369 1082,425 1073,425" fill="none" stroke="#526B6D" stroke-width="1" stroke-linejoin="round" marker-end="url(#am)"/><text x="360" y="458" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="0.8">BARRIER   waits for both branch_done nodes</text><polyline points="210,313 36,313 36,464" fill="none" stroke="#E8A33B" stroke-width="1.2" stroke-linejoin="round"/><polyline points="128,442 128,464" fill="none" stroke="#E8A33B" stroke-width="1.2" stroke-linejoin="round"/><line x1="36" y1="464" x2="680" y2="464" stroke="#E8A33B" stroke-width="1.4"/><line x1="128" y1="464" x2="128" y2="479" stroke="#E8A33B" stroke-width="1.4" marker-end="url(#aa)"/><rect x="64" y="482" width="128" height="34" fill="#1B1710" stroke="#E8A33B" stroke-width="1.4" rx="2"/><text x="128" y="502.5" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">save_outputs</text><line x1="192" y1="499" x2="205" y2="499" stroke="#E8A33B" stroke-width="1.2" marker-end="url(#aa)"/><rect x="208" y="486" width="72" height="26" fill="#161113" stroke="#E8A33B" stroke-width="1.4" rx="13"/><text x="244" y="503" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="600" text-anchor="middle" letter-spacing="1">END</text><text x="64" y="534" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#6E807F" font-weight="400">one write, both reports</text><text x="64" y="574" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">HOW TO READ A WRAPPED BRANCH</text><text x="64" y="594" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">Each branch is one sequential chain, folded to fit the page:</text><text x="64" y="610" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">follow the top row left to right, turn at the margin, then</text><text x="64" y="626" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">follow the second row right to left.</text><text x="64" y="660" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">TYPED STATE</text><text x="64" y="680" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12" fill="#95A8A6" font-weight="400">Every node reads and writes one typed state object.</text><rect x="700" y="444" width="516" height="234" fill="#101A1C" stroke="#222F32" stroke-width="1" rx="3"/><text x="716" y="470" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">IT WRITES ITS OWN DAX</text><text x="716" y="492" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">There is no query library. It plans the intents it needs,</text><text x="716" y="509" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">generates a query for each one, and validates every query</text><text x="716" y="526" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">against the model's real metadata before running it.</text><rect x="716" y="556" width="112" height="24" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="772" y="571.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">plan intents</text><rect x="844" y="556" width="112" height="24" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="900" y="571.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">generate</text><line x1="828" y1="568" x2="841" y2="568" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><rect x="972" y="556" width="112" height="24" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="1028" y="571.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">validate</text><line x1="956" y1="568" x2="969" y2="568" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><rect x="1100" y="556" width="112" height="24" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="1156" y="571.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">execute</text><line x1="1084" y1="568" x2="1097" y2="568" stroke="#526B6D" stroke-width="1" marker-end="url(#am)"/><polyline points="1156,580 1156,594 884,594 884,582" fill="none" stroke="#8A6524" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#aa)"/><text x="1020" y="610" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">the exact Power BI error text, one repair attempt</text><line x1="716" y1="622" x2="1200" y2="622" stroke="#222F32" stroke-width="1"/><text x="716" y="642" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.4">INDEPENDENT FAILURE</text><text x="716" y="660" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">If the descriptive branch's queries fail, the investigative report</text><text x="716" y="676" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">still ships. Neither branch waits on the other.</text></svg></section>
<section class="slide" aria-label="Slide 5 of 6: What earns a place on the page"><svg viewBox="0 0 1280 720" role="img" aria-label="The ranking blend, cross-run memory, the three-lever decomposition and the calendar comparator."><rect x="0" y="0" width="1280" height="720" fill="#0B1012"/><text x="64" y="54" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.6">THE GENERATOR   THE JUDGEMENT LAYER</text><text x="64" y="94" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="40" fill="#E8EFED" font-weight="700" letter-spacing="-0.2">What earns a place on the page</text><line x1="64" y1="108" x2="1216" y2="108" stroke="#222F32" stroke-width="1"/><text x="64" y="130" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="14.5" fill="#95A8A6" font-weight="400">Nothing reaches the briefing because it changed. It reaches the briefing because it out-ranked everything else.</text><rect x="64" y="150" width="596" height="282" fill="#101A1C" stroke="#222F32" stroke-width="1" rx="3"/><text x="84" y="184" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="22" fill="#E8A33B" font-weight="700">01</text><text x="116" y="184" font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="21" fill="#E8EFED" font-weight="700" letter-spacing="0.2">RELEVANCE RANKING</text><text x="84" y="208" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">a weighted blend, not raw percentage change</text><rect x="84" y="228" width="192" height="26" fill="#E8A33B" stroke="none" stroke-width="1"/><text x="180" y="245" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#17110A" font-weight="600" text-anchor="middle" letter-spacing="0.6">IMPACT 0.40</text><rect x="276" y="228" width="168" height="26" fill="#A9762A" stroke="none" stroke-width="1"/><text x="360" y="245" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#FFF3DF" font-weight="600" text-anchor="middle" letter-spacing="0.6">MAGNITUDE 0.35</text><rect x="444" y="228" width="120" height="26" fill="#6B5222" stroke="none" stroke-width="1"/><text x="504" y="245" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="600" text-anchor="middle" letter-spacing="0.6">UNEXPECTED 0.25</text><rect x="84" y="228" width="480" height="26" fill="none" stroke="#0B1012" stroke-width="1"/><text x="84" y="278" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#E8A33B" font-weight="600">0.40</text><text x="134" y="278" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">impact  —  the share of total business the move represents</text><text x="84" y="302" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#E8A33B" font-weight="600">0.35</text><text x="134" y="302" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">magnitude  —  the size of the move itself, capped</text><text x="84" y="326" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="12.5" fill="#E8A33B" font-weight="600">0.25</text><text x="134" y="326" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">unexpectedness  —  deviation from the peer median</text><line x1="84" y1="344" x2="564" y2="344" stroke="#222F32" stroke-width="1"/><text x="84" y="366" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.2">WHY A HUGE PERCENTAGE IS NOT A HEADLINE</text><rect x="84" y="378" width="216" height="26" fill="#141D20" stroke="#2C3C3F" stroke-width="1" rx="2"/><text x="192" y="394.96" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8EFED" font-weight="500" text-anchor="middle">a line item that moved 2,000%</text><text x="348" ill="#6E807F" font-weight="400">every area, same direction</text><text x="902" y="532" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#F2C480" font-weight="500" text-anchor="middle">all at once</text><line x1="872" y1="540" x2="933" y2="540" stroke="#E8A33B" stroke-width="1.2" marker-end="url(#aa)"/><rect x="940" y="518" width="276" height="44" fill="#1B1710" stroke="#E8A33B" stroke-width="1.4" rx="2"/><text x="1078" y="538" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#F2C480" font-weight="500" text-anchor="middle">flag the comparison period,</text><text x="1078" y="554" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#F2C480" font-weight="500" text-anchor="middle">not the month</text><text x="704" y="604" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11" fill="#E8A33B" font-weight="600" letter-spacing="1.2">AND IT NAMES WHAT IT CANNOT EXPLAIN</text><text x="704" y="626" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">It lists the areas the calendar does not account for, so the</text><text x="704" y="643" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#95A8A6" font-weight="400">caveat cannot be used as a blanket excuse for a bad month.</text></svg></section>

<script>
var slides=[].slice.call(document.querySelectorAll('.slide'));
var ticks=[].slice.call(document.querySelectorAll('#ticks i'));
var count=document.getElementById('count');
var stage=document.getElementById('stage');
var i=0;
function show(n){
  i=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach(function(s,k){s.classList.toggle('on',k===i);});
  ticks.forEach(function(t,k){
    t.className = k===i ? 'now' : (k<i ? 'seen' : '');
  });
  count.textContent=('0'+(i+1)).slice(-2)+' / 0'+slides.length;
}
function fit(){
  var s=Math.min(window.innerWidth/1280, window.innerHeight/720);
  stage.style.transform='scale('+s+')';
}
window.addEventListener('resize',fit);
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){show(i+1);e.preventDefault();}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){show(i-1);e.preventDefault();}
  else if(k==='Home'){show(0);e.preventDefault();}
  else if(k==='End'){show(slides.length-1);e.preventDefault();}
});
document.getElementById('prev').addEventListener('click',function(){show(i-1);});
document.getElementById('next').addEventListener('click',function(){show(i+1);});
ticks.forEach(function(t,k){t.addEventListener('click',function(){show(k);});});
fit();show(0);
</script>
